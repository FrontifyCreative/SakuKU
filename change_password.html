<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
  <title>Ganti Password — SakuKu</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="{{ url_for('static', filename='js/tailwind-config.js') }}"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.344.0"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-200">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-2xl bg-brand-600 flex items-center justify-center text-white mx-auto mb-3">
        <i data-lucide="key-round" class="w-6 h-6"></i>
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight">Ganti Password</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">{% if forced %}Demi keamanan, buat password baru sebelum melanjutkan.{% else %}Perbarui password akunmu.{% endif %}</p>
    </div>

    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6">
      <div id="pw-error" class="hidden mb-4 p-3 rounded-xl bg-rose-50 dark:bg-rose-500/15 text-rose-700 dark:text-rose-300 text-xs font-medium" role="alert"></div>
      <form id="form-pw" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1" for="pw-old">{% if forced %}Password sementara / saat ini{% else %}Password saat ini{% endif %}</label>
          <input type="password" id="pw-old" required maxlength="128" autocomplete="current-password" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1" for="pw-new">Password baru</label>
          <input type="password" id="pw-new" required minlength="8" maxlength="128" autocomplete="new-password" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
          <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1.5">Minimal 8 karakter, kombinasi huruf dan angka. Hindari kata umum seperti “password123”.</p>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1" for="pw-confirm">Ulangi password baru</label>
          <input type="password" id="pw-confirm" required minlength="8" maxlength="128" autocomplete="new-password" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm transition">Simpan Password Baru</button>
      </form>
      <div class="mt-4 text-center text-xs">
        {% if forced %}<button id="btn-logout" class="font-semibold text-slate-500 dark:text-slate-400 hover:underline">Keluar</button>
        {% else %}<a href="/" class="font-semibold text-slate-500 dark:text-slate-400 hover:underline">Kembali</a>{% endif %}
      </div>
    </div>
  </div>

  <script>
    if (localStorage.getItem("sakuku_theme") === "dark") document.documentElement.classList.add("dark");
    lucide.createIcons();
    const errBox = document.getElementById("pw-error");
    const showErr = (m) => { errBox.textContent = m; errBox.classList.remove("hidden"); };

    document.getElementById("form-pw").addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.classList.add("hidden");
      const old_password = document.getElementById("pw-old").value;
      const new_password = document.getElementById("pw-new").value;
      if (new_password !== document.getElementById("pw-confirm").value) return showErr("Konfirmasi password tidak sama");
      const res = await fetch("/api/account/password", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ old_password, new_password }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) window.location.href = "/";
      else showErr(data.error || "Gagal mengubah password");
    });

    document.getElementById("btn-logout")?.addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      window.location.href = "/auth";
    });
  </script>
</body>
</html>
